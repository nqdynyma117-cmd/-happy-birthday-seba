<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تولد سبا</title></head><body dir="rtl" style="font-family:tahoma;background:#ffd6e7;text-align:center;padding:40px"><div id="app"><h1>سلام سبای خوشگل ❤️</h1><p>یه سورپرایز کوچولو برات دارم...</p><button onclick="start()">شروع</button></div><script>let s=0,z=18;const q=["آیا آماده‌ای؟","به نظرت خوشگل‌ترین دختر دنیا سباست؟","آیا سبا لایق بهترین تولد دنیاست؟","آیا باید همین الان به سبا تبریک بگیم؟"];function start(){n()}function n(){if(s>=q.length){app.innerHTML="<h1>🎉 تولدت مبارک سبا 🎉</h1><p>امیدوارم ۱۲۰ سال عمر کنی و به همه آرزوهات برسی ❤️</p>";return;}app.innerHTML=`<h2>${q[s]}</h2><button id=y onclick="y()">آره</button><button id=o onclick="o()">نه</button>`;y=document.getElementById("y");y.style.fontSize=z+"px";}function y(){s++;z=18;n()}function o(){z+=8;document.getElementById("y").style.fontSize=z+"px";document.getElementById("o").style.transform="scale(.8)";alert("مطمئنی؟ 😅")}</script></body></html>
